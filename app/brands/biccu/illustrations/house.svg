<g>
  <!-- House (home / mortgage). Fits 0-360 zone. Brand palette. -->
  <circle cx="180" cy="180" r="150" fill="#FFFFFF"/>
  <circle cx="180" cy="180" r="150" fill="none" stroke="#47B8E8" stroke-width="2" opacity="0.5"/>

  <!-- House body (Primary Blue) -->
  <rect x="108" y="170" width="144" height="110" rx="6" fill="#0079C8"/>

  <!-- Roof (Dark Navy triangle) -->
  <path d="M88 178 L180 110 L272 178 Z" fill="#003C71"/>

  <!-- Roof trim line (Light Blue) -->
  <path d="M88 178 L272 178" stroke="#47B8E8" stroke-width="3"/>

  <!-- Door (white) -->
  <rect x="160" y="218" width="40" height="62" rx="4" fill="#FFFFFF"/>
  <circle cx="190" cy="250" r="3" fill="#F47A20"/>

  <!-- Window (white rounded square) -->
  <rect x="124" y="194" width="32" height="32" rx="4" fill="#FFFFFF"/>
  <line x1="140" y1="194" x2="140" y2="226" stroke="#0079C8" stroke-width="1.4"/>
  <line x1="124" y1="210" x2="156" y2="210" stroke="#0079C8" stroke-width="1.4"/>

  <!-- Chimney -->
  <rect x="220" y="132" width="16" height="32" fill="#003C71"/>

  <!-- Orange accent: small sun/circle top-right of roof -->
  <circle cx="262" cy="120" r="14" fill="#F47A20"/>
  <circle cx="262" cy="120" r="9" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.7"/>

  <!-- Ground line -->
  <line x1="84" y1="280" x2="276" y2="280" stroke="#003C71" stroke-width="2" opacity="0.6"/>
</g>
