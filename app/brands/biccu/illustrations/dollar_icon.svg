<g>
  <!-- Dollar icon (rounded square with $ glyph). Fits 0-360 zone. Brand palette. -->
  <circle cx="180" cy="180" r="150" fill="#FFFFFF"/>
  <circle cx="180" cy="180" r="150" fill="none" stroke="#47B8E8" stroke-width="2" opacity="0.5"/>

  <!-- Outer rounded square (Dark Navy) -->
  <rect x="96" y="96" width="168" height="168" rx="28" fill="#003C71"/>

  <!-- Inner rounded square (Primary Blue) -->
  <rect x="112" y="112" width="136" height="136" rx="22" fill="#0079C8"/>

  <!-- $ glyph (white, bold, large) -->
  <text x="180" y="220" font-size="120" font-weight="800" fill="#FFFFFF" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif">$</text>

  <!-- Orange accent dot (small, top-right of the inner square) -->
  <circle cx="226" cy="130" r="10" fill="#F47A20"/>
  <circle cx="226" cy="130" r="6" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.7"/>

  <!-- Subtle inner outline -->
  <rect x="124" y="124" width="112" height="112" rx="18" fill="none" stroke="#47B8E8" stroke-width="1.4" opacity="0.4"/>
</g>
