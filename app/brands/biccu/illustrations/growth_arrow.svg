<g>
  <!-- Growth arrow (upward trend). Fits 0-360 zone. Brand palette. -->
  <circle cx="180" cy="180" r="150" fill="#FFFFFF"/>
  <circle cx="180" cy="180" r="150" fill="none" stroke="#47B8E8" stroke-width="2" opacity="0.5"/>

  <!-- Bar chart (3 bars, increasing height, Dark Navy / Primary Blue / Light Blue) -->
  <rect x="100" y="220" width="36" height="50" rx="4" fill="#003C71"/>
  <rect x="150" y="180" width="36" height="90" rx="4" fill="#0079C8"/>
  <rect x="200" y="140" width="36" height="130" rx="4" fill="#47B8E8"/>

  <!-- Baseline -->
  <line x1="84" y1="276" x2="280" y2="276" stroke="#003C71" stroke-width="2"/>

  <!-- Upward arrow (orange) climbing over the bars -->
  <path d="M108 220 L168 180 L218 140" stroke="#F47A20" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Arrowhead at the top-right -->
  <path d="M218 140 L240 140 L240 162" stroke="#F47A20" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Small dot accents at the arrow joints -->
  <circle cx="108" cy="220" r="5" fill="#F47A20"/>
  <circle cx="168" cy="180" r="5" fill="#F47A20"/>

  <!-- Subtle dotted ascending trail above the arrow -->
  <g fill="#47B8E8" opacity="0.45">
    <circle cx="252" cy="120" r="3"/>
    <circle cx="262" cy="108" r="3"/>
    <circle cx="272" cy="96" r="3"/>
  </g>
</g>
